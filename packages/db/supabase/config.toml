# Local Supabase, as `pnpm db:start` runs it (packages/db/src/local-supabase.ts). It shapes
# the local stack only; production is the hosted project named here.
project_id = "zmdrwswxugswzmcokvff"

# Postgres is the only service this app runs on. Sessions are hand-rolled, not Supabase
# Auth; the Data API is OFF in production (CLAUDE.md); nothing uses Storage, Realtime or
# Edge Functions. So the local stack is Postgres alone: nothing downloaded or running that
# the app never calls, and no local Data API that production does not have.
[api]
enabled = false

[db]
# No `port` here, or under any service: the CLI gives every checkout and git branch its
# own stack on its own ports, and a pinned port makes a second branch's stack fail to
# bind. `pnpm db:start` writes the URL the CLI picked into .env.
#
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
major_version = 15

[db.pooler]
enabled = false

[db.seed]
# The seed is `pnpm db:seed` (src/seed/initial.ts), not a seed.sql.
enabled = false

[realtime]
enabled = false

[studio]
# `pnpm -F db studio` (Drizzle Studio) browses the local database.
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[auth]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[experimental]
# The CLI's stack backend: local Supabase as plain processes, without Docker, one stack
# per checkout and branch. Experimental (CLI 2.119+): its flags and output can change
# between releases, so re-run `pnpm db:start` after bumping `supabase`.
stack = true
