name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
      # `next build` runs as NODE_ENV=production, where the session signer fails
      # closed rather than fall back to the dev constant. Throwaway: CI never
      # signs a cookie anyone holds.
      COOKIE_SECRET: yours-sincerely-ci-only-cookie-secret-not-a-real-signer
      # Same fail-closed rule for the database client. Unreachable on purpose:
      # postgres.js connects lazily, so `next build` never dials it.
      POSTGRES_URL: postgresql://ci:ci@127.0.0.1:1/ci
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Typecheck
        run: pnpm typecheck

      # `expo customize` and `next typegen` run inside typecheck and can rewrite
      # tracked files; a stale committed copy must fail here, not drift silently.
      - name: Typecheck left tracked files unchanged
        run: git diff --exit-code

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
