name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      # Same command developers and agents run locally, so the gate cannot drift.
      - name: Verify
        run: pnpm verify
