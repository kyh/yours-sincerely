packages:
  - apps/*
  - packages/*

catalog:
  "@base-ui/react": ^1.7.0
  "@kyh/tsconfig": ^1.2.0
  "@orpc/client": 2.0.0-beta.31
  "@orpc/server": 2.0.0-beta.31
  "@orpc/tanstack-query": 2.0.0-beta.31
  "@tailwindcss/postcss": ^4.3.3
  "@tanstack/react-query": ^5.102.8
  "@types/node": ^26.4.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  class-variance-authority: ^0.7.1
  cn: ^0.2.5
  date-fns: ^4.4.0
  dotenv-cli: ^11.0.0
  # Shared by packages/api (which queries) and packages/db (which defines the schema).
  # A version desync between those two produces baffling type errors rather than clean
  # failures — which is exactly why it goes through the catalog.
  drizzle-orm: ^0.45.2
  lucide-react: ^1.35.0
  next: ^16.3.3
  next-themes: ^0.4.6
  react: 19.2.8
  react-dom: 19.2.8
  tailwindcss: ^4.3.3
  tsx: ^4.23.12
  typescript: ^7.0.2
  zod: ^4.5.2

catalogs:
  # Expo must hold an SDK-blessed React, which may diverge from web's. Pinning it in a
  # NAMED catalog keeps that constraint explicit and separately bumpable, instead of an
  # unexplained version literal in apps/expo/package.json that looks like drift.
  # Bump only alongside an Expo SDK upgrade.
  expo:
    react: 19.2.3
    react-dom: 19.2.3
    # Expo SDK 57 blesses TS 6; the rest of the repo is on 7.
    typescript: ~6.0.3

allowBuilds:
  esbuild: true
  supabase: true

overrides:
  lightningcss: "1.30.1"
  lucide-react: "catalog:"

minimumReleaseAgeExclude:
  - expo-blur@57.0.3
  - "@expo/cli@57.0.24"
  - "@expo/fingerprint@0.20.13"
  - "@expo/prebuild-config@57.0.16"
  - expo-asset@57.0.17
  - expo-constants@57.0.18
  - expo-file-system@57.0.7
  - expo-font@57.0.4
  - expo-keep-awake@57.0.2
  - expo-modules-autolinking@57.0.13
  - expo-modules-core@57.0.18
  - expo@57.0.22
  - "@expo/ui@57.0.18"
  - expo-application@57.0.3
  - expo-clipboard@57.0.2
  - expo-dev-client@57.0.19
  - expo-dev-launcher@57.0.20
  - expo-device@57.0.2
  - expo-glass-effect@57.0.3
  - expo-haptics@57.0.3
  - expo-image@57.0.5
  - expo-json-utils@57.0.2
  - expo-linking@57.0.10
  - expo-manifests@57.0.2
  - expo-network@57.0.2
  - expo-notifications@57.0.18
  - expo-router@57.0.21
  - expo-secure-store@57.0.4
  - expo-splash-screen@57.0.9
  - expo-symbols@57.0.3
  - expo-system-ui@57.0.4
  - expo-updates-interface@57.0.2
