packages:
  - apps/*
  - packages/*

catalog:
  "@base-ui/react": ^1.8.0
  "@kyh/tsconfig": ^1.2.0
  "@orpc/client": 2.0.0-beta.31
  "@orpc/contract": 2.0.0-beta.31
  "@orpc/server": 2.0.0-beta.31
  "@orpc/tanstack-query": 2.0.0-beta.31
  "@tailwindcss/postcss": ^4.3.3
  "@tanstack/react-query": ^5.103.2
  "@types/node": ^26.6.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.3.2
  date-fns: ^4.4.0
  dotenv-cli: ^11.0.0
  # Shared by packages/api (which queries) and packages/db (which defines the schema).
  # A version desync between those two produces baffling type errors rather than clean
  # failures — which is exactly why it goes through the catalog.
  drizzle-orm: 1.0.0-rc.4
  lucide-react: ^1.47.0
  next: ^16.3.5
  next-themes: ^0.4.6
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.15
  typescript: ^7.0.2
  zod: ^4.6.5

catalogs:
  # Expo must hold an SDK-blessed React, which may diverge from web's. Pinning it in a
  # NAMED catalog keeps that constraint explicit and separately bumpable, instead of an
  # unexplained version literal in apps/expo/package.json that looks like drift.
  # Bump only alongside an Expo SDK upgrade.
  expo:
    react: 19.2.3
    react-dom: 19.2.3
    "@types/react": ~19.2.18
    # Expo SDK 57 blesses TS 6; the rest of the repo is on 7.
    typescript: ~6.0.3

# Expo SDK 57 blesses exact versions of these; `pnpm up --latest` must not move them.
# Matching is by NAME, so `react`/`react-dom`/`typescript`/`@types/react` cannot go here
# without freezing web too — their `expo:` catalog rows are reverted by hand after a sweep.
update:
  ignoreDeps:
    - expo
    - expo-*
    - "!expo-server-sdk"
    - "@expo/*"
    - react-native
    - react-native-*
    - "@react-native/*"
    - "@react-native-async-storage/*"
    - lottie-react-native
    - nativewind

allowBuilds:
  esbuild: true
  supabase: true

overrides:
  lightningcss: "1.30.1"
  lucide-react: "catalog:"
